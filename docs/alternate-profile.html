<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meet Camille — Duolingo French Fashion</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet"><style>
:root{--green:#58cc02;--ink:#303030}*{box-sizing:border-box}body{margin:0;background:#fffef6;color:var(--ink);font-family:Nunito,Arial,sans-serif;overflow:hidden}main{position:relative;width:100vw;height:100dvh;min-height:500px;overflow:hidden;background:#fffef6}.bgshape{position:absolute;background:var(--green);border-radius:48%;filter:blur(.2px);z-index:0}.bgshape.a{width:48vw;height:40vw;right:-10vw;top:-22vw;transform:rotate(-24deg)}.bgshape.b{width:43vw;height:38vw;left:-25vw;bottom:-23vw;transform:rotate(12deg)}.logo{position:absolute;top:4.5%;left:4.5%;color:#21b31e;font-size:clamp(23px,2.7vw,42px);font-weight:900;letter-spacing:-.06em;z-index:5}.headline{position:absolute;top:27%;left:6%;z-index:5;font-size:clamp(60px,9.8vw,175px);font-weight:900;line-height:.91;letter-spacing:-.07em;animation:rise .9s both}.headline span{display:block;color:#21bf19}.portrait{position:absolute;z-index:3;left:43%;bottom:-4%;height:85%;width:40%;object-fit:cover;object-position:center 25%;border-radius:46% 46% 0 0;mask-image:linear-gradient(#000 83%,transparent 100%);animation:portraitIn 1.2s both}.sticker{position:absolute;z-index:6;background:white;border:5px solid #e5f7d9;border-radius:999px;padding:9px 26px;color:#20b620;font-size:clamp(19px,3vw,48px);font-weight:900;box-shadow:0 8px 0 #b7e9a3;animation:float 4s ease-in-out infinite, pop .7s backwards}.outfits{top:14%;left:38%;transform:rotate(-8deg);animation-delay:.3s}.paris{top:52%;right:6%;transform:rotate(-12deg);animation-delay:.6s}.deco{position:absolute;z-index:4;font-size:clamp(40px,6vw,105px);filter:drop-shadow(0 7px 0 white);animation:float 4.8s ease-in-out infinite,pop .7s backwards}.tower{top:12%;right:9%;animation-delay:.5s}.shirt{bottom:13%;left:13%;animation-delay:.9s}.bag{bottom:9%;right:13%;animation-delay:1.2s}.heart{left:7%;bottom:22%;animation-delay:.8s}.star{right:29%;top:14%;animation-delay:.4s}.subtitle{position:absolute;left:7%;bottom:10%;font-size:clamp(16px,1.7vw,27px);font-weight:800;max-width:28%;z-index:6}.controls{position:absolute;bottom:3%;right:4%;z-index:20;display:flex;align-items:center;gap:14px}.controls button{font:900 18px Nunito;border:0;border-radius:16px;padding:14px 25px;color:white;background:#58cc02;box-shadow:0 5px #3a9b00;cursor:pointer}.controls .back{background:white;color:#58cc02;box-shadow:0 5px #e3e3e3}.intro{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.2,.8,.2,1),opacity .9s}.next-world{position:absolute;inset:0;display:grid;place-items:center;background:#58cc02;color:white;text-align:center;transform:translateX(100%);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}.next-world h2{font-size:clamp(40px,7vw,110px);line-height:1.04;max-width:1000px;margin:0 8%}.next-world p{font-size:clamp(18px,2vw,32px);font-weight:800}.next-world .floatshirt{font-size:clamp(80px,13vw,200px);animation:float 4s ease-in-out infinite}main.advanced .intro{transform:translateX(-100%)}main.advanced .next-world{transform:translateX(0)}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -16px}}@keyframes pop{from{opacity:0;scale:.4}to{opacity:1;scale:1}}@keyframes rise{from{opacity:0;translate:0 50px}to{opacity:1;translate:0 0}}@keyframes portraitIn{from{opacity:0;translate:0 80px}to{opacity:1;translate:0 0}}@media(max-width:700px){.headline{top:18%;font-size:14vw}.portrait{left:29%;width:69%;height:63%}.outfits{top:12%;left:48%}.paris{top:55%;right:3%}.tower{top:32%;right:3%}.shirt{left:5%;bottom:26%}.subtitle{bottom:12%;max-width:62%;font-size:15px}.controls{bottom:2%;right:2%}.controls button{padding:10px 15px;font-size:14px}}@media(prefers-reduced-motion:reduce){.sticker,.deco,.next-world .floatshirt{animation:none}}
</style></head><body><main id="app"><div class="intro"><div class="bgshape a"></div><div class="bgshape b"></div><div class="logo">duolingo</div><div class="headline">Meet<span>Camille.</span></div><img class="portrait" src="assets/camille-intro.png" alt="Smiling Camille in a cream sweater"><div class="sticker outfits">outfits</div><div class="sticker paris">paris ♡</div><div class="deco tower">🗼</div><div class="deco shirt">👕</div><div class="deco bag">👜</div><div class="deco heart">💗</div><div class="deco star">✨</div><div class="subtitle">19 years old · Loves styling outfits · Dreams of Paris</div></div><div class="next-world"><div><div class="floatshirt">👕</div><h2>What if learning French felt like fashion?</h2><p>Step into Camille's world.</p></div></div><div class="controls"><button class="back" id="back">← Back</button><button id="next">Continue →</button></div></main><script>const app=document.getElementById('app');document.getElementById('next').onclick=()=>app.classList.add('advanced');document.getElementById('back').onclick=()=>app.classList.remove('advanced');window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')app.classList.add('advanced');if(e.key==='ArrowLeft')app.classList.remove('advanced');if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});</script></body></html>
